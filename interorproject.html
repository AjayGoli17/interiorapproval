<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interior Project Control — Admin Panel</title>
<!-- Fonts are optional: if offline, the system font stack is used. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:wght@400;500&display=swap" rel="stylesheet">

<!-- =====================================================================
     STYLES  (split into css/styles.css later if you wish)
     ===================================================================== -->
<style>
:root{
  --bg:#F8F7F4; --surface:#FFFFFF; --surface-raised:#FFFFFF; --surface-subtle:#F4F1EA;
  --ink:#1C201D; --ink-2:#3E4440; --muted:#6F7671;
  --line:#E6E2D8; --line-2:#F0ECE3;
  --accent:#1C3829; --accent-d:#12251B; --accent-soft:#EBF2EC; --accent-subtle:#DCE7DE;
  --sand:#C9BAA3; --sand-soft:#F6F3EE;
  --ok:#2D6843; --ok-bg:#EDF5F0; --warn:#8C5D16; --warn-bg:#FDF5E7;
  --bad:#A83A2E; --bad-bg:#FDF0EE; --info:#355B75; --info-bg:#EDF3F7; --neutral:#5F6661; --neutral-bg:#F0F2EF;
  --r:12px; --r-sm:7px; --r-lg:16px;
  --shadow-sm:0 1px 2px rgba(28,34,30,.03);
  --shadow:0 1px 3px rgba(28,34,30,.04), 0 4px 12px rgba(28,34,30,.025);
  --shadow-card:0 1px 3px rgba(28,34,30,.04), 0 6px 18px rgba(28,34,30,.035);
  --shadow-hover:0 4px 14px rgba(28,34,30,.08), 0 14px 30px rgba(28,34,30,.05);
  --sb:252px; --sb-c:68px; --top:62px;
  --font:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:Fraunces,Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.45 var(--font);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg{flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3,p{margin:0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Sidebar ---------- */
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sb);background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:40;transition:width .2s ease,transform .25s ease}
.ws{display:flex;align-items:center;gap:11px;padding:16px 16px 14px;min-height:64px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-size:19px;flex:none}
.ws-name{font-weight:600;line-height:1.2}
.ws-sub{font-size:12px;color:var(--muted)}
.nav{flex:1;overflow-y:auto;padding:4px 10px 12px}
.nav-group{margin-top:20px}
.nav-group-title{font-size:12.5px;font-weight:600;color:var(--muted);padding:0 10px 8px}
.nav-item{display:flex;align-items:center;gap:11px;height:42px;padding:0 10px;border-radius:var(--r-sm);color:var(--ink-2);position:relative;white-space:nowrap}
.nav-item:hover{background:var(--bg)}
.nav-item[aria-current="page"]{background:var(--accent-soft);color:var(--accent-d);font-weight:500}
.nav-badge{margin-left:auto;background:var(--accent);color:#fff;font-size:11px;font-weight:600;min-width:19px;height:19px;padding:0 6px;border-radius:999px;display:grid;place-items:center}
.sb-foot{padding:12px 18px;border-top:1px solid var(--line-2);font-size:12px;color:var(--muted)}
.sb-overlay{display:none}

body.sb-collapsed .sidebar{width:var(--sb-c)}
body.sb-collapsed .nav-label,body.sb-collapsed .ws-text,body.sb-collapsed .sb-foot,body.sb-collapsed .nav-group-title{display:none}
body.sb-collapsed .ws{justify-content:center;padding-inline:0}
body.sb-collapsed .nav-item{justify-content:center;padding:0}
body.sb-collapsed .nav-badge{position:absolute;top:3px;right:6px;min-width:8px;height:8px;padding:0;font-size:0}
body.sb-collapsed .nav-group{margin-top:8px;padding-top:8px;border-top:1px solid var(--line-2)}
body.sb-collapsed .nav-group:first-child{border-top:0;padding-top:0}

/* ---------- Main + Topbar ---------- */
.main{margin-left:var(--sb);min-height:100vh;transition:margin-left .2s ease;min-width:0}
body.sb-collapsed .main{margin-left:var(--sb-c)}
.topbar{position:sticky;top:0;z-index:30;height:var(--top);display:flex;align-items:center;gap:10px;padding:0 24px;background:rgba(246,244,239,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.icon-btn{width:38px;height:38px;border-radius:var(--r-sm);border:0;background:transparent;display:grid;place-items:center;color:var(--ink-2);position:relative}
.icon-btn:hover{background:rgba(36,36,31,.06)}
.page-title{font-size:16px;font-weight:600;margin-right:8px;white-space:nowrap}
.search{position:relative;flex:1;max-width:400px}
.search input{width:100%;height:38px;padding:0 12px 0 36px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
.search input::placeholder{color:var(--muted)}
.search .s-ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;display:flex}
.search-btn{display:none}
.spacer{flex:1}
.bell-count{position:absolute;top:4px;right:3px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:600;display:grid;place-items:center;border:2px solid var(--bg);box-sizing:content-box}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--sand);color:#3b3322;font-weight:600;font-size:12.5px;display:grid;place-items:center;border:0}
.menu-wrap{position:relative}
.menu{display:none;position:absolute;right:0;top:calc(100% + 8px);min-width:220px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 30px rgba(36,36,31,.12);padding:6px;z-index:60}
.menu-wrap.open>.menu{display:block}
.menu-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;background:transparent;border-radius:var(--r-sm);text-align:left;color:var(--ink)}
.menu-item:hover{background:var(--bg)}
.menu-item small{margin-left:auto;color:var(--muted);font-size:11.5px}
.menu-head{padding:8px 10px 10px;border-bottom:1px solid var(--line-2);margin-bottom:6px}
.menu-head b{display:block;font-weight:600}.menu-head span{font-size:12px;color:var(--muted)}
.results{display:none;position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 30px rgba(36,36,31,.12);padding:6px;z-index:60;max-height:60vh;overflow:auto}
.results.show{display:block}
.res-title{font-size:12px;color:var(--muted);padding:6px 10px 4px}
.res-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm)}
.res-item:hover{background:var(--bg)}
.res-item b{font-weight:500;display:block}.res-item small{color:var(--muted)}
.res-empty{padding:14px 10px;color:var(--muted)}

/* ---------- Page + shared components ---------- */
.page{padding:24px;max-width:1280px;margin:0 auto;container-type:inline-size;outline:0}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:26px;flex-wrap:wrap}
.page-head h2{font-family:var(--serif);font-weight:500;font-size:30px;letter-spacing:-.01em}
.page-head p{color:var(--muted);margin-top:2px;max-width:62ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 15px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);font-weight:500;white-space:nowrap}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-d)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{height:32px;padding:0 11px;font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px 6px}
.card-h h3{font-size:14.5px;font-weight:600}
.card-h span,.card-h a{font-size:12.5px;color:var(--muted)}
.card-h a:hover{color:var(--accent-d)}
.card-b{padding:8px 18px 18px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--neutral-bg);color:var(--neutral)}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}.badge.info{background:var(--info-bg);color:var(--info)}
.badge.plain::before{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:12.5px;color:var(--ink-2)}
.chip button{border:0;background:transparent;padding:0;display:flex;color:var(--muted)}
.bar{height:6px;border-radius:99px;background:var(--line-2);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.thumb{display:grid;place-items:center;border-radius:10px;color:rgba(36,36,31,.5);flex:none}
.thumb.md{width:44px;height:44px}.thumb.sm{width:36px;height:36px;border-radius:9px}
.empty{text-align:center;padding:34px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-weight:600;margin-bottom:4px}
.empty .btn{margin-top:12px}

/* ---------- Redesigned Overview & Architecture Studio Styling ---------- */
.overview-hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.overview-hero h2{font-family:var(--serif);font-weight:500;font-size:32px;letter-spacing:-.015em;line-height:1.15;color:var(--ink)}
.overview-hero p{color:var(--muted);margin-top:4px;font-size:14px}
.hero-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.biz-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:24px}
.biz-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .15s,box-shadow .15s;text-decoration:none;color:inherit;position:relative}
.biz-card:hover{border-color:#D4CFBF;transform:translateY(-2px);box-shadow:var(--shadow-card)}
.biz-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.biz-ic{width:32px;height:32px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.biz-ic.bad{background:var(--bad-bg);color:var(--bad)}.biz-ic.warn{background:var(--warn-bg);color:var(--warn)}
.biz-val{font-family:var(--serif);font-size:34px;font-weight:500;line-height:1.1;letter-spacing:-.015em;color:var(--ink);margin:4px 0 2px}
.biz-sub{font-size:13px;color:var(--muted);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.overview-projects-sec{margin-bottom:26px}
.op-sec-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.op-sec-title{font-family:var(--serif);font-size:22px;font-weight:500;display:flex;align-items:center;gap:10px;color:var(--ink)}
.op-sec-title .op-count{font-family:var(--font);font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent);padding:2px 9px;border-radius:999px}
.op-sec-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.op-stage-filters{display:flex;gap:6px;overflow-x:auto;padding:2px 0}
.stage-pill{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);padding:6px 14px;border-radius:999px;font-size:12.5px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap}
.stage-pill:hover{background:var(--bg);border-color:#D4CFBF}
.stage-pill.active{background:var(--accent);border-color:var(--accent);color:#fff}
.op-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(360px,100%),1fr));gap:18px}

.op-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-card);overflow:hidden;display:flex;flex-direction:column;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.op-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover);border-color:#D4CFBF}
.op-media{position:relative;aspect-ratio:16/9;background:var(--line-2);overflow:hidden}
.op-media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease}
.op-card:hover .op-media img{transform:scale(1.03)}
.op-badges{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;z-index:2}
.op-stage-badge{background:rgba(24,30,26,.82);color:#fff;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:500;letter-spacing:.02em}
.op-health-badge{backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

.op-body{padding:18px 20px;display:flex;flex-direction:column;gap:12px;flex:1}
.op-title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.op-name{font-family:var(--serif);font-size:18px;font-weight:500;line-height:1.25;margin:0;color:var(--ink)}
.op-client{font-size:13px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:6px}
.op-prog-wrap{display:flex;flex-direction:column;gap:5px;margin:2px 0}
.op-prog-lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.op-prog-lbl b{color:var(--ink);font-weight:600}
.op-meta-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px 12px;background:var(--bg);border-radius:var(--r-sm);font-size:12.5px}
.op-pm{display:flex;align-items:center;gap:8px;min-width:0}
.op-pm .av{width:28px;height:28px;font-size:11px;flex:none;background:var(--sand);color:#2E281C;font-weight:600;border-radius:50%;display:grid;place-items:center}
.op-pm-text{min-width:0;line-height:1.25}
.op-pm-text b{display:block;font-weight:500;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.op-pm-text small{font-size:11px;color:var(--muted)}
.op-due{display:flex;flex-direction:column;justify-content:center;min-width:0;line-height:1.25;text-align:right}
.op-due b{font-weight:500;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.op-due small{font-size:11px;color:var(--muted)}
.op-due small.late{color:var(--bad);font-weight:600}
.op-flag{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:var(--r-sm);font-size:12px;font-weight:500}
.op-flag.bad{background:var(--bad-bg);color:var(--bad)}
.op-flag.warn{background:var(--warn-bg);color:var(--warn)}
.op-flag.ok{background:var(--ok-bg);color:var(--ok)}
.op-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:14px;border-top:1px solid var(--line-2)}

.overview-lower{display:grid;grid-template-columns:7fr 5fr;gap:18px;margin-bottom:24px}
.att-list{display:flex;flex-direction:column;gap:8px}
.att-item{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface);color:inherit;transition:background .15s,border-color .15s}
a.att-item:hover{background:var(--bg);border-color:#D4CFBF}
.att-badge{flex:none;margin-top:1px}
.att-main{flex:1;min-width:0;line-height:1.35}
.att-main b{display:block;font-weight:600;font-size:13.5px;color:var(--ink);margin-bottom:2px}
.att-main p{font-size:12.5px;color:var(--muted);margin:0}
.att-arrow{color:var(--muted);flex:none;font-size:14px;margin-left:4px}

/* Legacy overview metrics (used by other sub-screens) */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.metric{display:flex;flex-direction:column;gap:2px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.metric:hover{border-color:#c9c5b6}
.m-top{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.m-ic{width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.m-val{font-family:var(--serif);font-size:32px;line-height:1.1;letter-spacing:-.01em;margin-top:4px}
.m-sub{font-size:12.5px;color:var(--muted)}
.row{display:grid;gap:16px;margin-bottom:16px}
.r-5-7{grid-template-columns:5fr 7fr}.r-7-5{grid-template-columns:7fr 5fr}
.row>*{min-width:0}
.srow{display:grid;grid-template-columns:118px 1fr 28px;gap:12px;align-items:center;padding:9px 6px;margin:0 -6px;border-radius:var(--r-sm)}
.srow:hover{background:var(--bg)}
.strack{height:10px;border-radius:99px;background:var(--line-2);overflow:hidden}
.strack i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.scount{text-align:right;font-weight:600}
.srow:nth-child(2) .strack i{opacity:.9}.srow:nth-child(3) .strack i{opacity:.8}.srow:nth-child(4) .strack i{opacity:.7}.srow:nth-child(5) .strack i{opacity:.6}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.trend{display:flex;gap:10px;height:190px;align-items:flex-end;padding-top:22px}
.tcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.tbars{display:flex;align-items:flex-end;gap:5px;height:100%;width:100%;justify-content:center}
.tb{position:relative;display:block;width:min(26px,40%);border-radius:5px 5px 2px 2px;min-height:3px}
.tb.n{background:var(--accent)}.tb.c{background:var(--sand)}
.tb em{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-style:normal;font-size:12px;color:var(--ink-2)}
.tlabel{font-size:12.5px;color:var(--muted)}
.li{display:flex;align-items:center;gap:12px;padding:10px 6px;margin:0 -6px;border-radius:var(--r-sm)}
a.li:hover{background:var(--bg)}
.li-main{flex:1;min-width:0}
.li-main b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-main small{display:block;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.li-side small{color:var(--muted)}
.act{display:flex;gap:12px;padding:9px 0}
.act-ic{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.act p{color:var(--ink-2)}.act small{color:var(--muted)}
.act-grid{display:grid;grid-template-columns:1fr 1fr;column-gap:36px}
.note{font-size:12.5px;color:var(--muted);margin-top:4px;padding:0 2px}

/* ---------- Projects preview ---------- */
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);background:var(--info-bg);color:var(--info);margin-bottom:16px;font-size:13.5px}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.prow{display:grid;grid-template-columns:44px minmax(150px,2.2fr) 130px 120px 130px 100px 92px;gap:14px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line-2)}
.prow:last-child{border-bottom:0}
.prow .sub{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcell small{color:var(--muted);display:block;font-size:12px}
.sm-only{display:none!important}

/* ---------- Modal, toast, forms ---------- */
.overlay{position:fixed;inset:0;background:rgba(36,36,31,.4);display:grid;place-items:center;padding:16px;z-index:100}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:520px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25)}

.err{display:block;color:var(--bad);font-size:12.5px;margin-top:4px;min-height:0}

/* ---------- Container-based responsiveness ---------- */
@container (max-width:1024px){
  .biz-summary{grid-template-columns:repeat(2,minmax(0,1fr))}

}

@media (pointer:coarse){.btn,.nav-item,.menu-item{min-height:42px}.icon-btn{width:42px;height:42px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

const KEY = 'ipcs.demo.v2';

function broadcastSync() { try { if (syncChan) syncChan.postMessage({ type: 'sync', key: KEY }); } catch (e) {} }

let S = load();
function load() {
  try { const r = localStorage.getItem(KEY); if (r) { const o = JSON.parse(r); if (o && o.v === 2 && Array.isArray(o.projects)) return o; } } catch (e) { /* fall through to seed */ }
  return seed();
}
function persist() {
  try {
    localStorage.setItem(KEY, JSON.stringify(S));
    broadcastSync();
  } catch (e) {

  }
}

function health(p) {
  if (p.status !== 'active') return { key: 'na', label: STATUS_LABEL[p.status], cls: p.status === 'completed' ? 'ok' : 'neutral' };
  const d = daysUntil(p.handoverOn);
  if (d < 0) return { key: 'delayed', label: 'Delayed', cls: 'bad' };
  if (d <= 30 && p.progress < 80) return { key: 'risk', label: 'At risk', cls: 'warn' };
  return { key: 'ok', label: 'On track', cls: 'ok' };
}

  risk:      { label: 'At risk',             fn: p => health(p).key === 'risk' },
  attention: { label: 'At risk or delayed',  fn: p => ['risk', 'delayed'].includes(health(p).key) },
  design:    { label: 'In design',           fn: p => p.status === 'active' && ['Design', 'Client Approval'].includes(p.stage) },

function submitForm(form) {
  const fm = FM, v = {}, err = {};
  fm.fields.forEach(x => {
    const el = form.elements[x.k], box = $(`.field[data-f="${x.k}"]`, form); if (!el || box.classList.contains('hidden')) return;
    let val = String(el.value).trim(); v[x.k] = val;
    if (x.req && !val) err[x.k] = 'This field is required.';
    else if (x.type === 'number' && val) { const n = Number(val); if (isNaN(n)) err[x.k] = 'Enter a valid number.'; else if (x.min != null && n < x.min) err[x.k] = `Must be at least ${x.min}.`; else if (x.max != null && n > x.max) err[x.k] = `Must be at most ${x.max}.`; else v[x.k] = n; }
    else if (x.type === 'date' && val && x.min && val < x.min) err[x.k] = 'Date is too early.';
    else if (x.type === 'email' && val && !/^\S+@\S+\.\S+$/.test(val)) err[x.k] = 'Enter a valid email address.';
  });
  if (!Object.keys(err).length && fm.check) Object.assign(err, fm.check(v) || {});
  $$('.field[data-f]', form).forEach(el => { const m = err[el.dataset.f] || ''; el.classList.toggle('invalid', !!m); $('.err', el).textContent = m; });
  const first = Object.keys(err)[0];
  if (first) { const el = form.elements[first]; if (el) el.focus(); return; }
  closeModal(); fm.onSubmit(v);
}

/* ============================== OVERVIEW ============================== */
function attention() {
  const out = [];
  // 1. Overdue site tasks (highest operational priority)
  S.tasks.forEach(t => {
    const p = projectById(t.projectId);
    if (p && !p.archived && t.status !== 'Done') {
      const d = daysUntil(t.due);
      if (d < 0) {
        out.push({
          p, sev: 0, cls: 'bad', tag: 'Overdue task',
          msg: `"${t.title}" (${t.room}) · ${plural(-d, 'day')} late · Assigned to ${memberName(t.assignee)}`,
          href: '#site?tab=tasks&p=' + p.id
        });
      }
    }
  });

  // 2. Delayed or slipping projects
  P().forEach(p => {
    const h = health(p), d = inDays(p);
    if (h.key === 'delayed') {
      out.push({ p, sev: 0, cls: 'bad', tag: 'Delayed project', msg: `Handover passed ${plural(-d, 'day')} ago (${p.progress}% complete)`, href: '#projects?id=' + p.id });
    } else if (h.key === 'risk') {
      out.push({ p, sev: 1, cls: 'warn', tag: 'At risk', msg: `Handover in ${plural(d, 'day')}, only ${p.progress}% complete`, href: '#projects?id=' + p.id });
    }
    if (p.status === 'active' && p.stage === 'Client Approval' && p.approvalSince) {
      const w = -daysUntil(p.approvalSince);
      if (w >= 3) {
        out.push({ p, sev: 1, cls: 'warn', tag: 'Client decision', msg: `Awaiting client approval for ${plural(w, 'day')}`, href: '#design?p=' + p.id });
      }
    }
    if (p.status === 'on_hold') {
      out.push({ p, sev: 2, cls: '', tag: 'On hold', msg: `Paused at ${p.stage}, ${p.progress}% complete`, href: '#projects?id=' + p.id });
    }
  });

  // 3. Unresolved high-severity site issues
  S.issues.forEach(i => {
    const p = projectById(i.projectId);
    if (p && !p.archived && i.status === 'Open' && i.severity === 'High') {
      out.push({ p, sev: 0, cls: 'bad', tag: 'Site issue', msg: `${i.title} (${i.room}) · High severity`, href: '#site?tab=issues&p=' + p.id });
    }
  });

  // 4. Overdue payments
  S.invoices.forEach(i => {
    const p = projectById(i.projectId);
    if (p && !p.archived && invSt(i).k === 'overdue') {
      const d = -daysUntil(i.due);
      out.push({ p, sev: 1, cls: 'warn', tag: 'Payment overdue', msg: `${i.id}: ${lk(i.amount - invPaid(i))} overdue by ${plural(d, 'day')}`, href: '#finance?tab=invoices&st=overdue' });
    }
  });

  // 5. Delayed materials
  S.pos.forEach(o => {
    const p = projectById(o.projectId);
    if (p && !p.archived && o.status === 'Delayed') {
      out.push({ p, sev: 2, cls: 'warn', tag: 'Delivery delayed', msg: `${o.item} delayed from ${o.supplierName || 'supplier'}`, href: '#procurement?status=Delayed' });
    }
  });

  // 6. Pending change requests
  S.changes.forEach(c => {
    const p = projectById(c.projectId);
    if (p && !p.archived && c.status === 'Pending') {
      out.push({ p, sev: 2, cls: 'info', tag: 'Change request', msg: `"${c.title}" awaiting review (+${lk(c.amount)})`, href: '#site?tab=changes' });
    }
  });

  return out.sort((a, b) => a.sev - b.sev);
}

  const delayedPo = S.pos.filter(o => o.projectId === p.id && o.status === 'Delayed').length;
  const highIssues = S.issues.filter(i => i.projectId === p.id && i.status === 'Open' && i.severity === 'High').length;

  if (p.status === 'on_hold') {
    flagHtml = `<div class="op-flag warn">${icon('pause', 13)}<span>Project on hold at ${esc(p.stage)}</span></div>`;

function workload(t) {
  const pr = P().filter(p => p.pmId === t.id && p.status === 'active'), tk = S.tasks.filter(x => x.assignee === t.id && x.status !== 'Done'), od = tk.filter(x => daysUntil(x.due) < 0);

      ${panel('Financial health', '', sm('Budget utilisation (active)', pctOf(spT, bdT) + '%', pctOf(spT, bdT)) + sm('Collection rate', billed ? pctOf(got, billed) + '%' : '-', pctOf(got, billed)) + sm('Projects forecast over budget', `${over.length} of ${act.length}`, pctOf(over.length, act.length)) + sm('Forecast margin', val ? Math.round((val - fc) / val * 100) + '%' : '-', val ? (val - fc) / val * 100 : 0))}</div>
    <div class="fx2 even" style="margin-top:16px">${panel('Lowest forecast margins', '', mg.map(x => `<div class="rk"><span class="rk-n"><a class="lnk" href="#projects?id=${x.p.id}">${esc(x.p.name)}</a></span><span class="rk-t"><i class="f" style="width:${Math.max(2, Math.min(100, x.mg))}%;background:${x.mg < 0 ? 'var(--bad)' : x.mg < 15 ? 'var(--amber)' : 'var(--accent)'}" ${tip(`<b>${esc(x.p.name)}</b><br>Contract ${lk(x.p.value)} · Forecast cost ${lk(x.f)}`)}></i></span><span class="rk-v">${x.mg}%</span></div>`).join('') || '<p class="muted">No data.</p>')}
      ${panel('Project performance', '', sm('On-time handovers', done.length ? pctOf(ontime.length, done.length) + '%' : '-', pctOf(ontime.length, done.length)) + sm('Average progress (active)', act.length ? Math.round(sum(act, p => p.progress) / act.length) + '%' : '-', act.length ? sum(act, p => p.progress) / act.length : 0) + sm('Site tasks completed', `${tkDone} of ${tkAll}`, pctOf(tkDone, tkAll)) + sm('Average duration', dur + ' days'))}</div>
    <div class="fx2 even" style="margin-top:16px">${panel('Spend by category', '', barRows(cats) || '<p class="muted">No expenses yet.</p>')}${panel('Team workload', '', barRows(S.team.map(t => { const w = workload(t); return [t.name.split(' ')[0], w.pct, w.pct + '%']; })))}</div>`;
}
ACT.csv = () => { const [name, fn] = DATASETS[UI.reports.ds], [h, r] = fn(); csv(`${UI.reports.ds}-${isoOf(today())}.csv`, h, r); toast(`${name} exported`); };
ACT.print = () => window.print();

/* ---------- Notifications ---------- */
const N_IC = { approval: 'pen', delay: 'clock', handover: 'calendar', task: 'hammer', procurement: 'package', payment: 'rupee', change: 'refresh' };
const N_GROUPS = [['all', 'All'], ['unread', 'Unread'], ['approval', 'Approvals'], ['delay', 'Delays'], ['task', 'Site'], ['procurement', 'Procurement'], ['payment', 'Payments'], ['change', 'Changes']];
function renderNotifications() {
  const f = UI.notifications.f, all = S.notifications.filter(n => !n.dismissed).sort((a, b) => new Date(b.at) - new Date(a.at));
  const list = all.filter(n => f === 'all' ? true : f === 'unread' ? !n.read : NOTE_KEY(n.type) === f);
  return pageHead('Notifications', `${all.filter(n => !n.read).length} unread`, `<button class="btn" data-action="n-check">${icon('refresh', 15)}Run checks</button><button class="btn" data-action="n-readall">${icon('check', 15)}Mark all read</button>`) +
    `<div class="tools">${tabs(N_GROUPS.map(([k, l]) => [k, l, k === 'unread' ? all.filter(n => !n.read).length : null]), f, 'f')}</div>
    <section class="card">${list.length ? list.map(n => `<div class="note-row ${n.read ? '' : 'unread'}"><span class="act-ic">${icon(N_IC[n.type] || 'bell', 15)}</span><div class="li-main"><b>${esc(n.title)}</b><small>${rel(n.at)}${n.projectId ? ' · ' + esc(pname(n.projectId)) : ''}</small></div>
      <div class="acts">${n.link ? `<a class="btn sm" href="${n.link}" data-action="n-read" data-id="${n.id}">Open</a>` : ''}${rbtn('n-toggle', n.id, n.read ? 'Mark unread' : 'Mark read', '')}${rbtn('n-del', n.id, '', 'x', 'aria-label="Dismiss"')}</div></div>`).join('') : emptyState('You are all caught up', f === 'all' ? 'New alerts appear when approvals, deliveries, payments or tasks need attention.' : 'Nothing in this view.')}</section>`;
}
const nref = () => { persist(); buildNav(); updateBadges(); };
ACT['n-read'] = el => { const n = S.notifications.find(x => x.id === el.dataset.id); if (n) { n.read = true; nref(); } };
ACT['n-toggle'] = el => { const n = S.notifications.find(x => x.id === el.dataset.id); n.read = !n.read; nref(); render(true); };
ACT['n-del'] = el => { const n = S.notifications.find(x => x.id === el.dataset.id); n.dismissed = true; n.read = true; nref(); render(true); toast('Notification dismissed'); };
ACT['n-readall'] = () => { S.notifications.forEach(n => n.read = true); nref(); render(true); toast('All notifications marked as read'); };
ACT['n-check'] = () => { const before = S.notifications.length; syncAlerts(); nref(); render(true); toast(S.notifications.length > before ? `${S.notifications.length - before} new alert(s) found` : 'Checked: no new alerts'); };

/* ---------- Settings ---------- */
const N_LABELS = { approval: 'Design approvals pending', delay: 'Project delays and handovers', task: 'Overdue site tasks', procurement: 'Delayed deliveries', payment: 'Payments and overdue invoices', change: 'Change requests' };
function renderSettings() {
  const s = S.settings, f = (k, l, v, t = 'text') => `<div class="field"><label for="s-${k}">${l}</label><input id="s-${k}" name="${k}" type="${t}" value="${esc(v)}" ${t === 'number' ? 'min="1" max="30"' : 'maxlength="80"'}></div>`;
  return pageHead('Settings', 'Studio profile and alert preferences') + `<form id="setForm" novalidate><div class="row r-5-7">
    <section class="card">${cardHead('Studio profile')}<div class="card-b">${f('company', 'Studio name', s.company)}${f('city', 'City', s.city)}${f('gst', 'GSTIN', s.gst)}${f('email', 'Email', s.email, 'email')}${f('phone', 'Phone', s.phone)}${f('ownerFull', 'Your name', s.ownerFull)}</div></section>
    <section class="card">${cardHead('Alerts')}<div class="card-b">${f('approvalDays', 'Remind about client approvals after (days)', s.approvalDays, 'number')}<div class="switches">${Object.entries(N_LABELS).map(([k, l]) => `<label class="switch"><input type="checkbox" name="n_${k}" ${s.notify[k] !== false ? 'checked' : ''}><i></i><span>${l}</span></label>`).join('')}</div>
      <p class="note">Currency is ₹ (INR) and dates follow the Indian format.</p></div></section></div>
    <div class="set-save"><button class="btn primary" type="submit">Save settings</button></div></form>
    <section class="card" style="margin-top:16px">${cardHead('Demo data')}<div class="card-b set-data"><span class="muted">Everything is stored only in this browser.</span><span class="spacer"></span><button class="btn" data-action="export-json">${icon('download', 15)}Export backup</button><button class="btn danger" data-action="reset">${icon('refresh', 15)}Reset sample data</button></div></section>`;
}
function saveSettings(form) {
  const g = k => String(form.elements[k].value).trim(), days = Number(g('approvalDays'));
  if (!g('company')) return toast('Studio name is required', 'error'); if (!(days >= 1 && days <= 30)) return toast('Reminder days must be between 1 and 30', 'error'); if (g('email') && !/^\S+@\S+\.\S+$/.test(g('email'))) return toast('Enter a valid email address', 'error');
  Object.assign(S.settings, { company: g('company'), city: g('city'), gst: g('gst'), email: g('email'), phone: g('phone'), ownerFull: g('ownerFull') || S.settings.ownerFull, owner: (g('ownerFull') || S.settings.ownerFull).split(' ')[0], approvalDays: Math.round(days) });
  Object.keys(N_LABELS).forEach(k => S.settings.notify[k] = form.elements['n_' + k].checked); commit('Settings saved');
}
ACT['export-json'] = () => { const b = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' }), a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'interior-demo-backup.json'; document.body.appendChild(a); a.click(); a.remove(); toast('Backup downloaded'); };
function applySettings() {
  const s = S.settings; $('.ws-name').textContent = s.company; $('.ws-sub').textContent = s.city + ' studio'; $('.logo').textContent = s.company.charAt(0).toUpperCase();
  $('#profileMenu .menu-head b').textContent = s.ownerFull; $('[data-menu="profile"]').textContent = s.ownerFull.split(' ').map(x => x[0]).slice(0, 2).join('').toUpperCase();
}

/* ============================== ROUTER ============================== */
const ROUTES = [
  { id: 'overview', label: 'Business Overview', icon: 'dashboard', group: 'Studio', render: renderOverview },
  { id: 'projects', label: 'Projects', icon: 'folder', group: 'Studio', render: renderProjects, body: projectsBody, sync: pvSync },
  { id: 'team', label: 'Team & Workload', icon: 'users', group: 'Studio', render: renderTeam, body: teamBody },
  { id: 'clients', label: 'Clients', icon: 'user', group: 'Studio', render: renderClients, body: clientsBody },
  { id: 'design', label: 'Design & Approvals', icon: 'pen', group: 'Workflow', render: renderDesign, body: designBody },
  { id: 'procurement', label: 'Procurement & Materials', icon: 'package', group: 'Workflow', render: renderProcurement, body: procBody },
  { id: 'site', label: 'Site Execution', icon: 'hammer', group: 'Workflow', render: renderSite, body: siteBody },
  { id: 'finance', label: 'Finance & Payments', icon: 'rupee', group: 'Business', render: renderFinance, body: financeBody },
  { id: 'timeline', label: 'Timeline & Delays', icon: 'calendar', group: 'Business', render: renderTimeline },
  { id: 'reports', label: 'Reports & Analytics', icon: 'chart', group: 'Business', render: renderReports },
  { id: 'notifications', label: 'Notifications', icon: 'bell', group: 'System', render: renderNotifications },
  { id: 'settings', label: 'Settings', icon: 'settings', group: 'System', render: renderSettings }
];

function buildNav() {
  const unread = S.notifications.filter(n => !n.read && !n.dismissed).length;
  let html = '', group = '';
  ROUTES.forEach(r => {
    if (r.group !== group) { if (group) html += '</div>'; group = r.group; html += `<div class="nav-group"><div class="nav-group-title">${group}</div>`; }
    html += `<a class="nav-item" href="#${r.id}" data-route="${r.id}" title="${r.label}">${icon(r.icon, 19)}<span class="nav-label">${r.label}</span>${r.id === 'notifications' && unread ? `<span class="nav-badge" data-unread>${unread}</span>` : ''}</a>`;
  });
  $('#nav').innerHTML = html + '</div>';
  $$('.nav-item').forEach(a => a.dataset.route === curId ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
}
function updateBadges() {
  const unread = S.notifications.filter(n => !n.read && !n.dismissed).length;
  $('#bell').innerHTML = icon('bell', 20) + (unread ? `<span class="bell-count">${unread}</span>` : '');
  $('#bell').setAttribute('aria-label', `Notifications, ${unread} unread`);
}
function render(keep) {
  const y = window.scrollY; $('#page').innerHTML = cur.render();
  $('#pageTitle').textContent = cur.label; document.title = cur.label + ' · Interior Project Control';
  $$('.nav-item').forEach(a => a.dataset.route === cur.id ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  window.scrollTo(0, keep ? y : 0);
}
function route() {
  const raw = location.hash.slice(1) || 'overview', [id, qs] = raw.split('?'), r = ROUTES.find(x => x.id === id) || ROUTES[0];
  cur = r; curId = r.id; UI[r.id] = DEF[r.id]();
  new URLSearchParams(qs || '').forEach((v, k) => { if (k in UI[r.id]) UI[r.id][k] = v; });
  if (r.id === 'projects' && !FILTERS[UI.projects.f] && UI.projects.f !== 'archived') UI.projects.f = 'total';
  render(false); document.body.classList.remove('sb-open'); closeMenus(); hideResults();
}

/* ============================== SEARCH ============================== */
function hideResults() { $('#results').classList.remove('show'); }
function runSearch(q) {
  const box = $('#results'); q = q.trim().toLowerCase();
  if (q.length < 2) { hideResults(); return; }
  const pr = P().filter(p => `${p.name} ${p.location} ${clientName(p.clientId)}`.toLowerCase().includes(q)).slice(0, 5);
  const cl = S.clients.filter(c => `${c.name} ${c.contact}`.toLowerCase().includes(q)).slice(0, 3);
  const tk = (S.tasks || []).filter(t => `${t.title} ${t.room} ${t.desc || ''}`.toLowerCase().includes(q)).slice(0, 3);
  let html = '';
  if (pr.length) html += `<div class="res-title">Projects</div>` + pr.map(p => `<a class="res-item" href="#projects?id=${p.id}">${thumb(p, 'sm')}<span><b>${esc(p.name)}</b><small>${esc(clientName(p.clientId))}</small></span></a>`).join('');
  if (cl.length) html += `<div class="res-title">Clients</div>` + cl.map(c => `<a class="res-item" href="#clients?q=${encodeURIComponent(c.name)}"><span class="m-ic">${icon('user', 15)}</span><span><b>${esc(c.name)}</b><small>${esc(c.contact || '')}</small></span></a>`).join('');
  if (tk.length) html += `<div class="res-title">Tasks</div>` + tk.map(t => `<a class="res-item" href="#site?tab=tasks&p=${t.projectId}"><span class="m-ic">${icon('hammer', 15)}</span><span><b>${esc(t.title)}</b><small>${esc(pname(t.projectId))} · ${esc(t.room)}</small></span></a>`).join('');
  box.innerHTML = html || `<div class="res-empty">No projects, clients or tasks match "${esc(q)}".</div>`; box.classList.add('show');
}

/* ============================== EVENTS ============================== */
function closeMenus() { $$('.menu-wrap.open').forEach(m => m.classList.remove('open')); }
const isDesktop = () => window.matchMedia('(min-width:900px)').matches;
Object.assign(ACT, {
  'toggle-sidebar': () => { if (isDesktop()) { const c = document.body.classList.toggle('sb-collapsed'); try { localStorage.setItem('ipcs.sb', c ? '1' : '0'); } catch (x) {} } else document.body.classList.toggle('sb-open'); },
  'close-sidebar': () => document.body.classList.remove('sb-open'),
  'toggle-search': () => { const tb = $('#topbar'); tb.classList.toggle('search-open'); if (tb.classList.contains('search-open')) $('#searchInput').focus(); },
  'close-modal': () => closeModal(),
  'confirm-yes': () => { const cb = confirmCb; closeModal(); if (cb) cb(); },
  tab: el => { UI[curId][el.dataset.k] = el.dataset.v; if (cur.body && el.dataset.k === 'view') { render(true); } else render(true); },
  reset: () => confirmDialog({ title: 'Reset sample data?', message: 'This removes everything you added or changed and restores the original sample data in this browser.', confirmLabel: 'Reset data', danger: true,
    onConfirm: () => { try { localStorage.removeItem(KEY); } catch (x) {} S = seed(); syncAlerts(); persist(); buildNav(); updateBadges(); applySettings(); location.hash.length > 1 ? (location.hash = '#overview') : route(); toast('Sample data restored'); } })
});
document.addEventListener('click', e => {
  const t = e.target, menuBtn = t.closest('[data-menu]');
  if (menuBtn) { const w = menuBtn.closest('.menu-wrap'), was = w.classList.contains('open'); closeMenus(); if (!was) w.classList.add('open'); return; }
  if (!t.closest('.menu-wrap')) closeMenus(); else if (t.closest('.menu-item')) closeMenus();
  if (!t.closest('.search')) hideResults();
  if (t.matches('[data-overlay]')) { closeModal(); return; }
  const a = t.closest('[data-action]'); if (a && ACT[a.dataset.action]) ACT[a.dataset.action](a, e);
});
/* a photo that fails to load is removed so its styled fallback layer shows */
document.addEventListener('error', e => { const t = e.target; if (t && t.tagName === 'IMG' && t.hasAttribute('data-fb')) t.remove(); }, true);
/* hover/touch tooltips for chart elements carrying data-tip */
const tipEl = document.createElement('div'); tipEl.className = 'tip'; tipEl.setAttribute('role', 'tooltip'); document.body.appendChild(tipEl);
const tipAt = (x, y) => { tipEl.style.left = Math.max(8, Math.min(innerWidth - tipEl.offsetWidth - 8, x + 14)) + 'px'; tipEl.style.top = Math.max(8, Math.min(innerHeight - tipEl.offsetHeight - 8, y + 16)) + 'px'; };
const tipOn = (el, x, y) => { tipEl.innerHTML = el.getAttribute('data-tip'); tipEl.classList.add('show'); tipAt(x, y); };
document.addEventListener('mouseover', e => { const t = e.target.closest && e.target.closest('[data-tip]'); if (t) tipOn(t, e.clientX, e.clientY); else tipEl.classList.remove('show'); });
document.addEventListener('mousemove', e => { if (tipEl.classList.contains('show')) tipAt(e.clientX, e.clientY); });
document.addEventListener('touchstart', e => { const t = e.target.closest && e.target.closest('[data-tip]'), p = e.touches[0]; if (t) { tipOn(t, p.clientX, p.clientY); setTimeout(() => tipEl.classList.remove('show'), 2600); } else tipEl.classList.remove('show'); }, { passive: true });
document.addEventListener('submit', e => {
  if (e.target.id === 'genForm') { e.preventDefault(); submitForm(e.target); }
  else if (e.target.id === 'setForm') { e.preventDefault(); saveSettings(e.target); }
});
document.addEventListener('input', e => {
  const el = e.target.closest('[data-ui]'); if (!el) return;
  UI[curId][el.dataset.ui] = el.value;
  if (cur.body) { const b = $('#sbody'); if (b) { b.innerHTML = cur.body(); if (cur.sync) cur.sync(); return; } }
  render(true);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.chg && CHG[el.dataset.chg]) { CHG[el.dataset.chg](el.dataset.id, el.value); return; }
  const form = el.closest('#genForm');
  if (form) $$('[data-when]', form).forEach(b => { const [k, v] = b.dataset.when.split(':'); b.classList.toggle('hidden', form.elements[k].value !== v); });
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('#modalRoot').firstChild) closeModal(); closeMenus(); hideResults(); document.body.classList.remove('sb-open'); $('#topbar').classList.remove('search-open'); }
  else if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); $('#searchInput').focus(); }
});
const si = $('#searchInput');
si.addEventListener('input', () => runSearch(si.value)); si.addEventListener('focus', () => runSearch(si.value));
si.addEventListener('keydown', e => { if (e.key === 'Enter' && si.value.trim()) { location.hash = '#projects?q=' + encodeURIComponent(si.value.trim()); si.blur(); $('#topbar').classList.remove('search-open'); } });
$('#results').addEventListener('click', () => { $('#topbar').classList.remove('search-open'); });
window.addEventListener('hashchange', route);

/* ============================== SHARED-DATA SYNC ==============================
   The PM panel and Client portal write to the same store (ipcs.demo.v2). When they do,
   reload it here so this panel never works on (or re-saves) a stale copy. */
function reloadShared() {
  if ($('#modalRoot').firstChild) { staleShared = true; return; }   /* never swap data under an open form */
  staleShared = false; S = load(); buildNav(); updateBadges(); applySettings(); render(true);
}
let syncT; window.addEventListener('storage', e => { if (e.key === KEY || e.key === null) { clearTimeout(syncT); syncT = setTimeout(reloadShared, 60); } });
if (syncChan) syncChan.addEventListener('message', e => { if (e && e.data && e.data.key === KEY) { clearTimeout(syncT); syncT = setTimeout(reloadShared, 60); } });

/* ============================== INIT ============================== */
$('#sbToggle').innerHTML = icon('panel', 20); $('#searchIc').innerHTML = icon('search', 16); $('#searchBtn').innerHTML = icon('search', 20); $('#plusIc').innerHTML = icon('plus', 17);
$$('[data-i]').forEach(el => el.innerHTML = icon(el.dataset.i, 17));
try { if (localStorage.getItem('ipcs.sb') === '1') document.body.classList.add('sb-collapsed'); } catch (e) {}
syncAlerts(); persist(); route(); buildNav(); updateBadges(); applySettings();
})();


</script>
</body>
</html>
