<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hearth Studio · Client Portal (Demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Tokens
   ========================================================= */
:root{
  --bg:#F7F5F0; --card:#fff; --line:#E7E2D8; --ink:#2A2A28; --muted:#6B675F;
  --sage:#5C7460; --sage-d:#4A6050; --sage-l:#E7EDE4;
  --beige:#EBE2D0; --beige-l:#F3EEE3;
  --amber:#8A5E24; --amber-l:#F6EBD6; --rose:#9A4C3A; --rose-l:#F7E4DE;
  --r:16px; --r-sm:12px;
  --shadow:0 1px 2px rgba(42,42,40,.04),0 10px 28px -16px rgba(42,42,40,.14);
  --font:'DM Sans',Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --serif:'Fraunces','Iowan Old Style',Georgia,serif; --sbw:220px; --hh:64px; --pad:clamp(16px,3vw,40px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--font);overflow-x:clip}
body.lock{overflow:hidden}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p,dl,dd,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
a{color:inherit}
:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;background:#fff;padding:10px 14px;border-radius:10px;z-index:100;border:1px solid var(--line)}
.skip:focus{top:12px}
.muted{color:var(--muted)} .small{font-size:13.5px}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* =========================================================
   Layout shell
   ========================================================= */
.app{display:grid;grid-template-columns:var(--sbw) minmax(0,1fr);min-height:100dvh;transition:grid-template-columns .25s ease}
.col{min-width:0}
.side{position:sticky;top:0;height:100dvh;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:12px;padding:16px 12px;z-index:60;overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px;padding:6px 8px 10px;min-height:48px}
.mark{width:34px;height:34px;border-radius:11px;background:var(--sage);color:#fff;display:grid;place-items:center;font-weight:600;flex:none}
.brand .lbl{font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.drawer-x{display:none;margin-left:auto}
#nav{display:grid;gap:4px}
.nav-item{position:relative;display:flex;align-items:center;gap:14px;min-height:46px;padding:0 14px;border-radius:12px;color:#4d4a43;text-decoration:none;font-weight:500;font-size:15px;transition:background .2s,color .2s}
.nav-item:hover{background:var(--beige-l)}
.nav-item[aria-current=page]{background:var(--sage-l);color:var(--sage-d)}
.badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--sage);color:#fff;font-size:11.5px;font-weight:600;display:grid;place-items:center}
.badge[hidden]{display:none}
.side-foot{margin-top:auto;display:grid;gap:10px}
.sb-toggle{display:flex;align-items:center;gap:14px;min-height:44px;padding:0 14px;border:0;background:none;border-radius:12px;color:var(--muted);font-size:14px}
.sb-toggle:hover{background:var(--beige-l)}
.sb-toggle .ic{transition:transform .25s}
.demo-note{font-size:12.5px;color:var(--muted);padding:0 14px}
.scrim{position:fixed;inset:0;background:rgba(35,33,28,.45);z-index:55}
.scrim[hidden]{display:none}

@media(min-width:768px){
  .app.collapsed{--sbw:76px}
  .collapsed .lbl{display:none}
  .collapsed .nav-item,.collapsed .sb-toggle{justify-content:center;padding:0}
  .collapsed .brand{justify-content:center;padding:6px 0 10px}
  .collapsed .badge{position:absolute;top:5px;right:9px;min-width:16px;height:16px;font-size:10px;padding:0 4px}
  .collapsed .sb-toggle .ic{transform:rotate(180deg)}
}
@media(max-width:767px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;width:min(290px,86vw);transform:translateX(-104%);transition:transform .28s ease;box-shadow:0 0 50px rgba(0,0,0,.2)}
  .side.open{transform:none}
  .drawer-x{display:grid}
  .sb-toggle{display:none}
}

/* Header */
.top{position:sticky;top:0;z-index:40;height:var(--hh);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 var(--pad);background:rgba(247,245,240,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.top-l,.top-r{display:flex;align-items:center;gap:10px;min-width:0}
.crumb{font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-btn{display:none}
@media(max-width:767px){.menu-btn{display:grid}}
.demo-chip{font-size:12px;color:var(--amber);background:var(--amber-l);padding:4px 10px;border-radius:99px;font-weight:500;white-space:nowrap}
@media(max-width:520px){.demo-chip{display:none}}
.icon-btn{position:relative;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:#fff;transition:background .2s}
.icon-btn:hover{background:var(--beige-l)}
.dot-badge{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--sage);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center;border:2px solid var(--bg)}
.dot-badge[hidden]{display:none}
.avatar{width:44px;height:44px;border-radius:50%;border:0;background:var(--beige);font-weight:600;color:#5b4f3a;font-size:14px}
.avatar:hover{background:#e2d6bf}
.pop-wrap{position:relative}
.pop{position:absolute;right:0;top:calc(100% + 10px);width:min(380px,calc(100vw - 24px));background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 60px -18px rgba(40,36,28,.32);padding:8px;z-index:70;max-height:min(70dvh,560px);overflow:auto}
.pop[hidden]{display:none}
@media(max-width:600px){.pop{position:fixed;left:12px;right:12px;top:calc(var(--hh) + 4px);width:auto}}
.pop-h{display:flex;justify-content:space-between;align-items:center;padding:8px 10px 6px;gap:8px}
.pop-h strong{font-weight:500}
.link-btn{border:0;background:none;color:var(--sage-d);font-size:13.5px;font-weight:500;padding:8px;border-radius:8px}
.link-btn:hover{background:var(--sage-l)}
.nitem{display:flex;gap:12px;width:100%;text-align:left;padding:12px;border:0;background:none;border-radius:12px}
.nitem:hover{background:var(--beige-l)}
.nitem .ud{width:8px;height:8px;border-radius:50%;margin-top:8px;flex:none;background:transparent}
.nitem.unread .ud{background:var(--sage)}
.nitem strong{display:block;font-weight:500;font-size:15px}
.nitem small{display:block;color:var(--muted);font-size:13px}
.prof{padding:10px}
.prof-top{display:flex;gap:12px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line)}
.prof-top .avatar{flex:none}
.kv{display:grid;gap:10px;margin:12px 0}
.kv div{display:flex;justify-content:space-between;gap:16px;font-size:14.5px}
.kv dt{color:var(--muted)} .kv dd{text-align:right;overflow-wrap:anywhere}

/* Main */
.main{padding:8px var(--pad) 56px;max-width:1240px;margin:0 auto;width:100%;outline:none}
.page-head{margin:8px 0 26px}
.page-head h1{font-size:clamp(27px,4.4vw,42px);font-weight:500;letter-spacing:-.025em;line-height:1.12;outline:none}
.sub{color:var(--muted);margin-top:8px}
.sec{font-size:20px;font-weight:500;margin:38px 0 14px;letter-spacing:-.01em}
.eyebrow{font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:14px}
.demo-foot{margin-top:48px;text-align:center;color:var(--muted);font-size:13px}

/* =========================================================
   Primitives
   ========================================================= */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,2.4vw,24px);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:500;font-size:15px;transition:background .2s,border-color .2s,transform .1s;text-decoration:none}
.btn:hover{border-color:#d3cbb9;background:var(--beige-l)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--sage);border-color:var(--sage);color:#fff}
.btn.primary:hover{background:var(--sage-d);border-color:var(--sage-d)}
.btn.danger{color:var(--rose);border-color:#e6c9c0}
.btn.danger:hover{background:var(--rose-l)}
.btn.sm{min-height:40px;padding:0 18px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12.5px;font-weight:500;background:var(--beige-l);color:#5b5446;white-space:nowrap}
.chip.ok{background:var(--sage-l);color:var(--sage-d)}
.chip.warn{background:var(--amber-l);color:var(--amber)}
.chip.bad{background:var(--rose-l);color:var(--rose)}
.chip.glass{background:rgba(255,255,255,.9);color:var(--ink)}
.bar{height:8px;border-radius:99px;background:var(--beige-l);overflow:hidden}
.bar.tall{height:12px}
.bar>i{display:block;height:100%;background:var(--sage);border-radius:inherit;animation:grow .9s ease both}
@keyframes grow{from{width:0}}
.okbox{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--sage-l);color:var(--sage-d);font-weight:500}
.notice{padding:14px 16px;border-radius:12px;margin-bottom:16px;background:var(--amber-l);color:var(--amber);font-weight:500}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed #d9d2c3;border-radius:14px}
.list{display:grid;gap:10px}
.li{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:14px}
.li .l{min-width:0;flex:1 1 180px}
.li .l strong{display:block;font-weight:500}
.li .l small{color:var(--muted);font-size:13.5px}
.li .r{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.amt{font-weight:500;font-variant-numeric:tabular-nums}

/* Media + graceful image fallback */
.media{position:relative;overflow:hidden;background:var(--sw,linear-gradient(135deg,var(--beige),var(--beige-l)))}
.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s ease;z-index:1}
.media img.loaded{opacity:1}
.media img.failed{display:none}
.media[data-label]:not([style*="--sw"])::after{content:attr(data-label);position:absolute;inset:0;display:grid;place-items:center;padding:12px;text-align:center;color:rgba(70,62,48,.5);font-size:14px}
.r43{aspect-ratio:4/3} .r169{aspect-ratio:16/10}

/* =========================================================
   Forms + dialogs
   ========================================================= */
.field{display:grid;gap:6px;margin-bottom:14px}
.field label,.stack-form label{font-size:14px;font-weight:500}
input,textarea,select{width:100%;min-height:46px;padding:10px 14px;border:1px solid #d9d2c3;border-radius:12px;background:#fff;font:inherit;font-size:16px;color:inherit}
textarea{resize:vertical;min-height:96px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--sage);outline-offset:1px;border-color:var(--sage)}
input[type=file]{padding:9px 12px;font-size:14px}
.two-f{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:480px){.two-f{grid-template-columns:1fr 1fr}}
.err{color:var(--rose);font-size:14px;font-weight:500;margin:4px 0 10px}
.err[hidden]{display:none}
.stack-form{display:grid;gap:8px}

dialog{border:0;padding:0;border-radius:20px;background:#fff;color:var(--ink);width:min(560px,calc(100vw - 24px));max-width:none;max-height:calc(100dvh - 24px);box-shadow:0 30px 80px -20px rgba(30,28,24,.4);overflow:hidden}
dialog::backdrop{background:rgba(35,33,28,.5);backdrop-filter:blur(2px)}
dialog[open]{display:flex;flex-direction:column;animation:pop .22s ease}
dialog.wide{width:min(1000px,calc(100vw - 24px))}
#confirm{width:min(440px,calc(100vw - 24px))}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
.dlg-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 20px 10px}
.dlg-head h2{font-size:20px;font-weight:500;letter-spacing:-.01em}
.dlg-body{padding:6px 20px 20px;overflow:auto;-webkit-overflow-scrolling:touch}
.dlg-foot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:14px 20px calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
@media(max-width:560px){
  dialog{width:100%;margin:auto 0 0;border-radius:20px 20px 0 0;max-height:92dvh}
  dialog.wide{width:100%}
  #confirm{width:100%}
  .dlg-foot .btn{flex:1 1 100%}
  .dlg-foot{flex-direction:column-reverse}
}
.toasts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);display:grid;gap:8px;z-index:200;width:max-content;max-width:calc(100vw - 24px);pointer-events:none}
.toast{background:#2A2A28;color:#fff;padding:12px 20px;border-radius:999px;font-size:14.5px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:pop .25s ease;text-align:center}
.toast.bad{background:var(--rose)}
.toast.out{opacity:0;transition:opacity .3s}

/* Lightbox */
dialog.lb{width:min(1100px,calc(100vw - 24px));background:#1d1c19;color:#fff;border-radius:18px}
.lb .media{background:#1d1c19;border-radius:0}
.lb .media img{object-fit:contain}
.lb .lbm{aspect-ratio:16/10;max-height:68dvh;width:100%}
.lb .media[data-label]::after{color:rgba(255,255,255,.55)}
.lb-x{position:absolute;right:12px;top:12px;z-index:5;background:rgba(255,255,255,.92)}
.lb-cap{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px calc(16px + env(safe-area-inset-bottom))}
.lb-cap strong{display:block;font-weight:500}
.lb-cap span{color:#cfcabd;font-size:14px}
.lb-nav{display:flex;gap:8px}
.lb-nav .icon-btn{background:#fff}
@media(max-width:560px){dialog.lb{border-radius:18px 18px 0 0}}

/* =========================================================
   Home
   ========================================================= */
.home{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.hero{position:relative;border-radius:var(--r);overflow:hidden;min-height:300px;color:#fff;box-shadow:var(--shadow)}
.hero .media{position:absolute;inset:0}
.hero::after{content:'';position:absolute;inset:0;z-index:2;background:linear-gradient(180deg,rgba(0,0,0,.12),transparent 35%,rgba(22,19,14,.6));pointer-events:none}
.hero-top,.hero-bot{position:absolute;left:20px;right:20px;z-index:3}
.hero-top{top:18px}.hero-bot{bottom:18px}
.hero-bot strong{display:block;font-size:clamp(20px,3vw,28px);font-weight:500;letter-spacing:-.01em}
.loc{display:flex;align-items:center;gap:6px;font-size:14px;opacity:.95}
.prog{display:flex;align-items:center;gap:22px}
.ring{position:relative;width:124px;height:124px;flex:none}
.ring svg{width:100%;height:100%}
.ring-n{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.1}
.ring-n strong{font-size:28px;font-weight:500;letter-spacing:-.02em}
.ring-n span{font-size:12px;color:var(--muted)}
.prog-info{display:grid;gap:2px;min-width:0}
.prog-info .k{font-size:12.5px;color:var(--muted);margin-top:10px}
.prog-info .k:first-child{margin-top:0}
.prog-info strong{font-weight:500;font-size:18px}
.acts{display:grid;gap:10px}
.action{display:flex;align-items:center;gap:14px;width:100%;min-height:68px;padding:14px 16px;text-align:left;border:1px solid var(--line);border-radius:14px;background:#fff;transition:border-color .2s,background .2s}
.action:hover{border-color:var(--sage);background:var(--sage-l)}
.action .ai{width:40px;height:40px;border-radius:12px;background:var(--beige-l);display:grid;place-items:center;flex:none;color:var(--sage-d)}
.action .tx{min-width:0}
.action strong{display:block;font-weight:500}
.action small{color:var(--muted);font-size:13.5px}
.action>.ic:last-child{margin-left:auto;color:var(--muted)}
.upd{display:grid;gap:18px;grid-template-columns:minmax(0,1fr);align-items:center}
.upd-thumb{display:block;width:100%;padding:0;border:0;border-radius:14px;overflow:hidden;background:none}
.upd-thumb .media{aspect-ratio:16/10;border-radius:14px;transition:transform .3s}
.upd-thumb:hover .media{transform:scale(1.01)}
.upd h3{font-size:19px;font-weight:500;margin:4px 0 6px}
@media(min-width:700px){
  .home{grid-template-columns:1fr 1fr}
  .hero{grid-column:1/-1;min-height:380px}
  .upd{grid-column:1/-1;grid-template-columns:minmax(220px,300px) 1fr}
}
@media(min-width:1024px){
  .home{grid-template-columns:1.4fr 1fr}
  .hero{grid-column:1;grid-row:span 2;min-height:470px}
}
@media(max-width:380px){.prog{flex-direction:column;align-items:flex-start}}

/* =========================================================
   Designs
   ========================================================= */
.rooms{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:640px){.rooms{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}}
.room{display:block;width:100%;text-align:left;padding:0;border:1px solid var(--line);background:#fff;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);transition:transform .25s ease,box-shadow .25s ease}
.room:hover{transform:translateY(-3px);box-shadow:0 18px 40px -20px rgba(42,42,40,.25)}
.room .media{border-radius:0}
.room .meta{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;flex-wrap:wrap}
.room .meta strong{display:block;font-weight:500;font-size:18px}
.room .meta small{color:var(--muted)}
.dd{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media(min-width:820px){.dd{grid-template-columns:1.25fr 1fr;gap:28px}}
.dd .media{border-radius:14px}
.dd-side{display:grid;gap:18px;align-content:start;min-width:0}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg-b{min-height:44px;min-width:64px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.seg-b[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.seg-b i{width:8px;height:8px;border-radius:50%;background:#c9c2b2}
.seg-b i.ok{background:var(--sage)} .seg-b i.warn{background:#c9953f} .seg-b i.bad{background:#c0705c}
.note{background:var(--beige-l);border-radius:12px;padding:14px 16px}
.note .k{font-size:12.5px;color:var(--muted);display:block;margin-bottom:4px}
.hist{display:grid;gap:8px;font-size:14px}
.hist li{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.hist .cm{display:block;color:var(--muted);margin-top:2px}

/* =========================================================
   Materials
   ========================================================= */
.mats{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(min(270px,100%),1fr))}
.mat{padding:0;overflow:hidden;display:flex;flex-direction:column}
.mat .media{aspect-ratio:4/3;border-radius:0}
.mat-b{padding:16px 18px 18px;display:grid;gap:10px;flex:1;align-content:start}
.mat-b h3{font-size:18px;font-weight:500}
.mat-b .spec{color:var(--muted);font-size:14.5px}
.mat-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.price{font-weight:500}
.mat-b .row{margin-top:auto;padding-top:6px}
.mat-b .row .btn{flex:1 1 auto}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;padding:10px;border:1.5px solid var(--line);border-radius:14px;cursor:pointer;transition:border-color .2s,background .2s;position:relative}
.opt:hover{background:var(--beige-l)}
.opt.on{border-color:var(--sage);background:var(--sage-l)}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;min-height:0;cursor:pointer}
.opt:focus-within{outline:2px solid var(--sage);outline-offset:2px}

    return !!(d && d.v === SEED.v &&

      d.materials.every(m => Array.isArray(m.options) && m.options.length) &&

      d.handover && Array.isArray(d.handover.items) && d.profile && d.milestone && typeof d.stage === 'string');

const accepted = () => S.changes.filter(c => (c.status === 'Approved' || c.status === 'Completed') && c.proposal && Number.isFinite(Number(c.cost)));
const addCosts = () => accepted().reduce((a, c) => a + Math.max(0, Number(c.cost)), 0);

  const num = v => (Number.isFinite(Number(v)) ? Number(v) : 0);

  const bal = Math.max(0, revised() - fixed);

  const bi = S.payments.findIndex(p => p.amount == null);

function addEntry(f) {

function editEntry(f) {

let delBusy = false;
async function delOne(kind, id) {
  const k = CK[kind]; if (!k || delBusy || k.locked()) return;
  const x = k.list().find(y => y.id === id); if (!x) return;
  delBusy = true; let ok = false;
  try { ok = await ask({ title: `Delete this ${k.noun}?`, text: `"${k.label(x)}" will be removed from ${k.where}. Original project records are not affected. This cannot be undone in this demo.`, ok: 'Delete', tone: 'danger' }); } finally { delBusy = false; }
  if (!ok || !k.list().some(y => y.id === id)) return;
  k.drop([id]); save(); render(); toast(`Deleted ${k.noun}`);
}
async function delAll(kind) {
  const k = CK[kind]; if (!k || delBusy || k.locked()) return;
  const n = k.list().length;
  if (!n) { toast(`No custom ${k.plural} to delete in ${k.where}.`); return; }

function activity() {
  const e = [], arr = v => (Array.isArray(v) ? v : []), add = (d, t, sub) => { if (t) e.push({ d: typeof d === 'string' && fmtDate(d) ? d : '', t: String(t), s: sub || '' }); };
  arr(S.changes).forEach(c => arr(c && c.history).forEach(h => h && add(h.date, c.title || 'Change request', 'Change request · ' + (h.s || 'Update'))));
  try { payList().forEach(p => { if (p && p.paid === true) add(p.date, 'Payment received', `${p.label || 'Payment'} · ${inr(p.amount)}`); }); } catch (x) {}
  arr(S.designs).forEach(d => arr(d && d.versions).forEach(v => v && v.decided && add(v.decided, `${d.room || 'Room'} design approved`, 'Version ' + (v.v || ''))));
  arr(S.materials).forEach(m => { if (m && m.decided) add(m.decided, `${selOpt(m).name || m.name || 'Material'} approved`, m.name || 'Material selection'); });

    <div style="display:grid;gap:16px;align-content:start">
      <section class="card" aria-label="Confirm handover"><h2 class="eyebrow">Confirm handover</h2>
        ${c ? `<div class="okbox">${ic('i-check')} <span>Handover confirmed on ${fmtDate(c)} (demo). Welcome home!</span></div>`
          : `<button class="btn primary" style="width:100%" data-a="hv-confirm" ${left.length ? 'disabled aria-disabled="true" aria-describedby="hvMsg"' : 'aria-describedby="hvMsg"'}>Confirm Handover</button>
             <div id="hvMsg" aria-live="polite">${left.length ? `<p class="small" style="margin-top:10px">${left.length} required item${left.length > 1 ? 's' : ''} still outstanding:</p><ul class="small muted" style="margin:6px 0 0 18px;list-style:disc">${left.map(i => `<li>${esc(i.label)}${i.client ? '' : ' (completed by your design team)'}</li>`).join('')}</ul>` : `<p class="muted small" style="margin-top:10px">All required items are complete. Confirming is a simulated demo action.</p>`}</div>`}
      </section>
      <section class="card" aria-label="Documents"><h2 class="eyebrow">Documents</h2><div class="list">
        <div class="li inv"><span class="ficon">${ic('i-file')}</span><div class="l"><strong>Approved design summary</strong><small>Generated from your approvals</small></div><div class="r"><button class="btn sm" data-a="doc" data-id="doc-design">Preview</button></div></div>
        <div class="li inv"><span class="ficon">${ic('i-file')}</span><div class="l"><strong>Budget statement</strong><small>Generated from your records</small></div><div class="r"><button class="btn sm" data-a="doc" data-id="doc-budget">Preview</button></div></div>
        <div class="li inv"><span class="ficon">${ic('i-file')}</span><div class="l"><strong>Warranty documents</strong><small>Not supplied yet</small></div><div class="r">${chip('Optional')}</div></div>
        ${udocs().map(d => `<div class="li inv"><span class="ficon">${ic('i-file')}</span><div class="l"><strong>${esc(d.title)}</strong><small>${esc(d.type || 'Document')} · added ${fmtDate(d.date)}</small></div><div class="r"><button class="btn sm" data-a="doc" data-id="ud-${esc(d.id)}">Preview</button>${d.custom ? `<button class="btn sm" data-a="cust-edit" data-kind="doc" data-id="${esc(d.id)}" aria-label="Edit ${esc(d.title)}" style="margin-left:6px">Edit</button><button class="btn sm danger" data-a="cust-del" data-kind="doc" data-id="${esc(d.id)}" aria-label="Delete ${esc(d.title)}" style="margin-left:6px">Delete</button>` : ''}</div></div>`).join('')}
      </div></section>
      ${customBox('doc', 'Add document')}
    </div></div>`;
}

function docPreview(id) {
  const P = S.profile, rows = [];
  let title = 'Document';
  if (id.startsWith('pay-')) {
    const p = payList().find(x => 'pay-' + x.id === id); if (!p) return;
    title = `${p.paid ? 'Receipt' : 'Invoice'} ${p.no}`;
    rows.push(['Client', P.name], ['Project', `${P.project}, ${P.location}`], ['For', p.label], ['Amount', payAmt(p)], [p.paid ? 'Paid on' : 'Due on', fmtDate(p.date)], ['Status', p.paid ? 'Paid' : (p.tag || 'Upcoming')]);
  } else if (id.startsWith('ud-')) {
    const d = udocs().find(x => 'ud-' + x.id === id); if (!d) return;
    title = d.title; rows.push(['Type', d.type || 'Document'], ['Added', fmtDate(d.date)], ['Project', `${P.project}, ${P.location}`]); if (d.note) rows.push(['Note', d.note]);
  } else if (id === 'doc-design') {
    title = 'Approved design summary';
    S.designs.forEach(d => { const c = curV(d); rows.push([d.room, `${c.v} · ${c.status}${c.decided ? ' · ' + fmtDate(c.decided, true) : ''}`]); });
  } else if (id === 'doc-budget') {
    title = 'Budget statement';
    rows.push(['Original approved budget', inr(S.budget.original)], ['Approved additional costs', '+ ' + inr(addCosts())], ['Approved credits', '− ' + inr(credits())], ['Revised approved budget', inr(revised())], ['Amount paid', inr(paidTotal())], ['Outstanding balance', inr(balanceDue())]);
  } else return;
  setModal(esc(title), `<dl class="kv">${rows.map(r => `<div><dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd></div>`).join('')}</dl>
    <p class="muted small">Sample document generated for this demo.</p>`, { foot: `<button class="btn" data-a="close">Close</button>` });
}

const VIEWS = { home: vHome, designs: vDesigns, materials: vMaterials, progress: vProgress, budget: vBudget, changes: vChanges, handover: vHandover };

/* =========================================================
   6. Chrome: nav, notifications, profile, drawer, sidebar
   ========================================================= */
function buildNav() {
  $('#nav').innerHTML = NAV.map(([k, label, icon]) => `<a class="nav-item" href="#/${k}" data-nav="${k}" title="${label}">${ic(icon)}<span class="lbl">${label}</span><span class="badge" hidden></span></a>`).join('');
}
function updateChrome(k) {
  const c = counts(), item = NAV.find(n => n[0] === k);
  $('#crumb').textContent = item[1];
  document.title = `${item[1]} · Hearth Studio (Demo)`;
  $$('.nav-item').forEach(a => {
    const on = a.dataset.nav === k;
    if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    const n = c[a.dataset.nav] || 0, b = $('.badge', a);
    b.hidden = !n; b.textContent = n;
  });
  const bell = $('#bellCount'); bell.hidden = !c.unread; bell.textContent = c.unread;
  $('#avatar').textContent = S.profile.initials;
}
function notifSub(n) {
  if (n.dyn && n.dyn.startsWith('pay:')) { const p = payList().find(x => x.id === n.dyn.slice(4)); if (p) return `${inr(p.amount)} due ${fmtDate(p.date, true)}`; }
  return n.sub || '';
}
function renderNotif() {
  const list = [...S.notifications].sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
  $('#popNotif').innerHTML = `<div class="pop-h"><strong>Notifications</strong><button class="link-btn" data-a="notif-read">Mark all read</button></div>` +
    (list.length ? list.map(n => `<button class="nitem ${n.read ? '' : 'unread'}" data-a="notif" data-id="${n.id}"><span class="ud"></span><span><strong>${esc(n.text)}</strong><small>${esc(notifSub(n))} · ${fmtDate(n.date, true)}</small></span></button>`).join('')
      : `<div class="empty" style="margin:8px">Nothing new</div>`);
}
function renderProfile() {
  const P = S.profile;
  $('#popProfile').innerHTML = `<div class="prof">
    <div class="prof-top"><span class="avatar" aria-hidden="true">${esc(P.initials)}</span><div><strong>${esc(P.name)}</strong><div class="muted small">${esc(P.project)} · ${esc(P.location)}</div></div></div>
    <dl class="kv"><div><dt>Account</dt><dd>Demo · Client view</dd></div><div><dt>Email</dt><dd>${esc(P.email)}</dd></div><div><dt>Phone</dt><dd>${esc(P.phone)}</dd></div></dl>
    <h3 class="eyebrow" style="margin:14px 0 0">Project contact</h3>
    <dl class="kv"><div><dt>${esc(P.designerRole)}</dt><dd>${esc(P.designer)}</dd></div><div><dt>Phone</dt><dd>${esc(P.studioPhone)}</dd></div><div><dt>Email</dt><dd>${esc(P.studioEmail)}</dd></div></dl>
    ${LINK && IPCS.client.clients().length > 1 ? `<h3 class="eyebrow" style="margin:14px 0 0">Viewing as (prototype)</h3><select data-ipcs-client aria-label="Client" style="width:100%;margin:6px 0 4px">${IPCS.client.clients().map(x => `<option value="${esc(x.id)}"${x.id === LINK.state.cid ? ' selected' : ''}>${esc(x.name)}</option>`).join('')}</select>` : ''}
    <p class="muted small" style="margin-bottom:12px">Sample details for this demo.</p>
    <button class="btn danger sm" style="width:100%" data-a="reset">Reset Demo Data</button></div>`;
}
function closePops() {
  $$('.pop').forEach(p => p.hidden = true);
  $$('[data-p]').forEach(b => b.setAttribute('aria-expanded', 'false'));
}
function togglePop(name) {
  const map = { notif: 'popNotif', profile: 'popProfile' };
  Object.keys(map).forEach(k => {
    const p = $('#' + map[k]), open = k === name && p.hidden;
    p.hidden = !open; $(`[data-p="${k}"]`).setAttribute('aria-expanded', String(open));
  });
}
const sb = { collapsed: false, pref: false };
try { const v = localStorage.getItem('hearth-sb'); if (v !== null) { sb.pref = true; sb.collapsed = v === '1'; } } catch (e) {}
const mqD = matchMedia('(min-width:1024px)'), mqM = matchMedia('(max-width:767px)');
function applySb() {
  $('#app').classList.toggle('collapsed', sb.collapsed);
  const b = $('.sb-toggle');
  b.setAttribute('aria-expanded', String(!sb.collapsed));
  b.setAttribute('aria-label', sb.collapsed ? 'Expand sidebar' : 'Collapse sidebar');
}
function sbDefault() { if (!sb.pref) sb.collapsed = !mqD.matches; applySb(); }
function syncSide() { $('#side').inert = mqM.matches && !$('#side').classList.contains('open'); }
function openDrawer() { $('#side').classList.add('open'); $('#scrim').hidden = false; $('.menu-btn').setAttribute('aria-expanded', 'true'); syncSide(); const a = $('.nav-item[aria-current]') || $('.nav-item'); if (a) a.focus(); }
function closeDrawer() { $('#side').classList.remove('open'); $('#scrim').hidden = true; $('.menu-btn').setAttribute('aria-expanded', 'false'); syncSide(); }

/* =========================================================
   7. Router + render
   ========================================================= */
let after = null, retried = false;
const route = () => { const k = location.hash.replace(/^#\/?/, '') || 'home'; return VIEWS[k] ? k : 'home'; };
function settle() { $$('.media img').forEach(i => { if (i.complete && i.naturalWidth) i.classList.add('loaded'); }); }
function render() {
  try {
    const k = route();
    $('#view').innerHTML = VIEWS[k]() + `<p class="demo-foot">Demo prototype · sample records saved in this browser only</p>`;
    updateChrome(k); renderNotif(); renderProfile(); settle();
  } catch (err) {
    console.error(err);
    if (!retried) { retried = true; S = clone(SEED); save(); render(); }
  }
}
function runAfter() { const f = after; after = null; if (f) f(); }
function go(k, fn) { after = fn || null; if (route() === k && location.hash) { render(); runAfter(); } else location.hash = '#/' + k; }
window.addEventListener('hashchange', () => {
  render(); window.scrollTo(0, 0); closeDrawer(); closePops();
  const h = $('#view h1'); if (h && !after) h.focus({ preventScroll: true });
  runAfter();
});

/* =========================================================
   8. Actions (event delegation)
   ========================================================= */
let busy = false;
const A = {
  sb() { sb.collapsed = !sb.collapsed; sb.pref = true; try { localStorage.setItem('hearth-sb', sb.collapsed ? '1' : '0'); } catch (e) {} applySb(); },
  drawer: openDrawer, 'drawer-close': closeDrawer,
  pop(el) { togglePop(el.dataset.p); },
  close(el) { const d = el.closest('dialog'); if (d) d.close(); },
  go(el) { go(el.dataset.go); },
  act(el) { const id = el.dataset.id; if (el.dataset.k === 'change') go('changes'); else if (el.dataset.k === 'design') go('designs', () => openDesign(id)); else go('materials', () => openMat(id)); },
  /* designs */
  'open-design'(el) { openDesign(el.dataset.id); },
  dv(el) { if (ui.design) { ui.design.v = el.dataset.v; ui.design.form = false; renderDesign(); } },
  'design-approve': approveDesign,
  'design-change'() { if (ui.design) { ui.design.form = true; renderDesign(); } },
  'design-change-cancel'() { if (ui.design) { ui.design.form = false; renderDesign(); } },
  /* materials */
  'open-mat'(el) { openMat(el.dataset.id); },
  'mat-approve-card'(el) { approveMat(el.dataset.id, null, false); },
  'mat-approve'() { if (ui.mat) approveMat(ui.mat.id, ui.mat.sel, true); },
  'mat-save'() {
    const u = ui.mat; if (!u) return;
    const m = getMat(u.id); if (!m || m.status === 'Ordered' || u.sel === m.selected) return;
    m.selected = u.sel; m.status = 'Awaiting approval'; save();
    renderMat(); render(); toast('Preference saved. Approve when ready.');
  },
  /* progress */
  photo(el) { openLB(Number(el.dataset.i) || 0); },
  lb(el) { openLB(ui.lb + Number(el.dataset.d)); },
  /* budget + docs */
  doc(el) { docPreview(el.dataset.id); },
  /* changes */
  'cr-new': openChangeForm,
  'cr-decide'(el) { decide(el.dataset.id, el.dataset.d); },
  'cr-studio'(el) { studioReply(el.dataset.id); },
  'cust-add'(el) { openAdd(el.dataset.kind); },
  'cust-edit'(el) { openEdit(el.dataset.kind, el.dataset.id); },
  'cust-del'(el) { delOne(el.dataset.kind, el.dataset.id); },
  'cust-delall'(el) { delAll(el.dataset.kind); },
  /* handover */
  'hv-toggle'(el) {
    const it = S.handover.items.find(x => x.id === el.dataset.id);
    if (!it || !it.client || S.handover.confirmed) return;
    it.done = !it.done;
    if (it.done) { it.prevNote = it.note; it.note = 'Marked complete ' + fmtDate(today(), true); } else if ('prevNote' in it) { it.note = it.prevNote; delete it.prevNote; }
    if (it.done) notify('Handover progress', `${it.label} · marked complete`, 'handover');
    save(); render(); toast(it.done ? 'Marked complete' : 'Marked outstanding');
  },
  async 'hv-confirm'() {
    if (S.handover.confirmed) return;
    const out = hvItems().filter(i => !i.optional && !i.done && i.id !== 'confirm');
    if (out.length) { toast(`${out.length} required item${out.length > 1 ? 's' : ''} still outstanding`, 'bad'); return; }
    if (busy) return; busy = true;
    let ok = false;
    try { ok = await ask({ title: 'Confirm handover?', text: 'This is a simulated demo action, nothing real is recorded.', ok: 'Confirm handover' }); } finally { busy = false; }
    if (!ok || S.handover.confirmed || hvItems().some(i => i && !i.optional && !i.done && i.id !== 'confirm')) return;
    S.handover.confirmed = today(); notify('Handover confirmed', 'Demo action', 'handover'); save(); render(); toast('Handover confirmed (demo)');
  },
  /* notifications + profile */
  notif(el) {
    const n = S.notifications.find(x => x.id === el.dataset.id); if (!n) return;
    n.read = true; save(); closePops();
    go(n.go, () => { if (n.design && getDesign(n.design)) openDesign(n.design); if (n.mat && getMat(n.mat)) openMat(n.mat); });
  },
  'notif-read'() { S.notifications.forEach(n => n.read = true); save(); updateChrome(route()); renderNotif(); },
  async reset() {
    closePops();
    const ok = await ask({ title: 'Reset demo data?', text: 'All approvals, requests and decisions will return to the original sample data.', ok: 'Reset', tone: 'danger' });
    if (!ok) return;
    if (LINK) { IPCS.client.resetPortal(LINK.pid); LINK = IPCS.client.open(); S = LINK.state; } else { S = clone(SEED); save(); }
    ui.design = ui.mat = null;
    if (location.hash !== '#/home') location.hash = '#/home'; else render();
    toast('Demo data reset');
  }
};
document.addEventListener('click', e => {
  if (!e.target.closest('.pop-wrap')) closePops();
  const el = e.target.closest('[data-a]');
  if (el && A[el.dataset.a]) { A[el.dataset.a](el, e); return; }
  if (e.target.tagName === 'DIALOG' && e.target.id !== 'confirm') e.target.close();   // backdrop click
});

/* ---------- Forms ---------- */
const F = {
  add: addEntry,
  edit: editEntry,
  revise(f) {
    const t = f.elements.c.value.trim(), err = $('.err', f);
    if (t.length < 5) { err.textContent = 'Please add a short comment.'; err.hidden = false; f.elements.c.focus(); return; }
    const u = ui.design, d = getDesign(u.id), ver = verOf(d, d.current);
    d.comments.push({ v: ver.v, text: t, date: today() });
    ver.status = 'Revision requested'; u.form = false; save();
    renderDesign(); render(); toast('Revision request saved');
  },
  change(f) {
    const el = f.elements, err = $('.err', f);
    const title = el.ttl.value.trim(), desc = el.desc.value.trim();
    const cost = el.cost.value === '' ? 0 : Number(el.cost.value);
    let m = '';
    if (!title) m = 'Please add a short title.';
    else if (!desc) m = 'Please add a short description.';
    else if (!Number.isFinite(cost) || cost < 0) m = 'Enter a cost of 0 or more.';
    if (m) { err.textContent = m; err.hidden = false; return; }
    const file = el.ref && el.ref.files && el.ref.files[0] ? el.ref.files[0].name : '';
    if (f.dataset.busy) return; f.dataset.busy = '1';   // ignore repeated submits
    S.changes.unshift({ id: 'c' + Date.now(), title, desc, estimate: Math.round(cost), proposal: null, cost: null, impact: el.impact.value, ref: file, status: 'Under review', history: [{ s: 'Submitted', date: today() }], custom: true });
    notify('Change request submitted', `${title} · Under studio review`, 'changes');
    save(); $('#modal').close(); render(); toast('Request submitted. Under studio review');
  }
};
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault(); if (F[f.dataset.form]) F[f.dataset.form](f);
});
document.addEventListener('change', e => {
  if (e.target.matches('#modal input[name="o"]') && ui.mat) { ui.mat.sel = e.target.value; renderMat(); const c = $('#modal input[name="o"]:checked'); if (c) c.focus(); }
});

/* ---------- Global listeners ---------- */
// image load / error fallback (capture because load/error do not bubble)
document.addEventListener('load', e => { if (e.target.tagName === 'IMG') e.target.classList.add('loaded'); }, true);
document.addEventListener('error', e => { if (e.target.tagName === 'IMG') e.target.classList.add('failed'); }, true);
document.addEventListener('close', e => {
  sync();
  if (e.target.id === 'modal') { ui.design = null; ui.mat = null; }
}, true);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('.pop:not([hidden])')) closePops(); if ($('#side').classList.contains('open')) closeDrawer(); }
  const lb = $('#lightbox');
  if (lb.open && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) openLB(ui.lb + (e.key === 'ArrowRight' ? 1 : -1));
});
try { mqD.addEventListener('change', sbDefault); mqM.addEventListener('change', () => { if (!mqM.matches) closeDrawer(); syncSide(); }); } catch (e) {}

/* ---------- Shared-data sync: pick client + live refresh when Admin / PM change something ---------- */
function reloadShared() {
  const l = IPCS.client.open(); if (!l) return; LINK = l; S = l.state;
  if (ui.design && !getDesign(ui.design.id)) { ui.design = null; const m = $('#modal'); if (m.open) m.close(); }
  render(); if (ui.design && $('#modal').open) renderDesign();
}
if (LINK) IPCS.onChange(() => { if ($('#confirm').open) return setTimeout(reloadShared, 800); reloadShared(); });
document.addEventListener('change', e => {
  if (e.target.matches('[data-ipcs-client]')) { IPCS.client.select(e.target.value); ui.design = ui.mat = null; reloadShared(); closePops(); toast('Switched client view'); }
});

/* =========================================================
   9. Boot
   ========================================================= */
buildNav(); sbDefault(); syncSide(); render();
})();
</script>
</body>
</html>
