<!DOCTYPE html>

<style>
*{box-sizing:border-box;margin:0}
:root{--bg:#F7F5F0;--s:#fff;--ink:#2A2A28;--mu:#6B675F;--bd:#E7E2D8;--ac:#5C7460;--ol:#5C7460;--rd:#b24c3c;--am:#c0872a;--gn:#5d7a48;--bl:#4b6a84}

button,input,select,textarea{font:inherit;color:inherit}

.ic{width:18px;height:18px;flex:none}.sp{flex:1}.rs{font-size:12px}

.srch{padding:10px 14px;border:1px solid var(--bd);border-radius:9px;background:#fff;width:200px}
.card{background:var(--s);border:1px solid var(--bd);border-radius:14px;padding:18px}
.grid{display:grid;gap:16px}.mu{color:var(--mu);font-size:13px}.tt{font-weight:500}.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi{grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-bottom:14px}.kpi .card{padding:12px 14px;display:flex;align-items:center;gap:10px}
.kpi b{font-family:Fraunces,Georgia,serif;font-size:26px;font-weight:500;line-height:1}.dot{width:8px;height:8px;border-radius:50%;background:var(--mu);flex:none}
.d-r{background:var(--rd)}.d-a{background:var(--am)}.d-g{background:var(--gn)}.d-b{background:var(--bl)}
.wg{grid-template-columns:1.6fr 1fr}.pg{grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}.sg{grid-template-columns:1.6fr 1fr;align-items:start}

.tc.od{border-left:3px solid var(--rd)}.tc.bk{border-left:3px solid var(--am);background:#fffaf0}.tf{display:flex;gap:6px;align-items:center}

.flow{display:flex;gap:6px;align-items:center;margin-bottom:14px;flex-wrap:wrap}.st{flex:1;min-width:120px;background:#fff;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center}.st b{font-family:Fraunces,Georgia,serif;font-size:22px;font-weight:500}.ar{color:var(--mu)}

.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.rt{border:1px solid var(--bd);border-radius:10px;padding:11px;display:flex;flex-direction:column;gap:7px}.rt.ok{border-color:var(--gn);background:#f3f7ee}
.pills{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.pill{padding:6px 14px;border-radius:99px;border:1px solid var(--bd);background:#fff;cursor:pointer}.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pc{cursor:pointer;display:flex;flex-direction:column;gap:12px}.pc:hover{border-color:var(--ac)}.hd{display:flex;gap:12px;align-items:center}
.sev{width:4px;align-self:stretch;border-radius:4px;background:#cfc8b8}.sev.high{background:var(--rd)}.sev.med{background:var(--am)}
.tl{position:relative;padding-left:18px;border-left:2px solid var(--bd);margin-left:4px}.tl>div{position:relative;padding:0 0 14px}.tl>div:before{content:"";position:absolute;left:-24px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--ac);border:2px solid #fff}
.tl .r:before{background:var(--rd)}.tl .g:before{background:var(--gn)}
.md{position:fixed;inset:0;background:#2a292680;display:grid;place-items:center;z-index:50;padding:16px}.mb{background:#fff;border-radius:14px;padding:22px;width:min(480px,100%);max-height:92vh;overflow:auto}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:10px}label input,label select,label textarea{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:#fff;margin-top:4px;font-size:14px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ma{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}#toast.on{opacity:1}
.ctr{text-align:center;display:grid;place-items:center;gap:6px}.fb{font-style:italic;color:var(--mu);font-size:12px}
@media(max-width:1000px){.wg,.sg{grid-template-columns:minmax(0,1fr)}.mr{grid-template-columns:1fr 1fr}}
@media(max-width:860px){body{display:block}aside{position:fixed;top:auto;bottom:0;left:0;right:0;width:auto;height:auto;flex-direction:row;gap:0;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:40;border:0;border-top:1px solid var(--bd);justify-content:space-around}
.logo,.sp,.rs{display:none}aside button{flex-direction:column;gap:2px;font-size:10.5px;line-height:1.15;text-align:center;min-width:0;min-height:52px;padding:6px 2px;flex:1;align-items:center;justify-content:center}main{padding:16px 14px calc(88px + env(safe-area-inset-bottom))}h1{font-size:23px}.srch{width:100%}.kb{grid-template-columns:repeat(4,250px)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<aside id="nav"><div class="logo">Shilpa<b>.</b>Interiors</div></aside>

<script>
const $=s=>document.querySelector(s),K='pmp.v1',D=n=>new Date(Date.now()+n*864e5).toISOString().slice(0,10),df=s=>Math.round((new Date(s)-new Date(D(0)))/864e5);

const NAV=[['day','My Workday'],['proj','Projects'],['task','Tasks'],['des','Designs'],['mat','Materials'],['site','Site & Handover']];
$('#nav').insertAdjacentHTML('beforeend',NAV.map(n=>`<button data-a="nav" data-i="${n[0]}">${ic(n[0])}<span>${n[1]}</span></button>`).join('')+'<div class="sp"></div><button class="rs" data-a="reset">Reset demo data</button>');
const TT={day:'My Workday',proj:'Project Workspace',task:'Tasks & Assignments',des:'Design Decisions',mat:'Material Tracker',site:'Site & Handover'};

{id:'l',n:'Linden Penthouse',st:'Design Development',b:[96,260],ms:['Joinery sign-off',9],rooms:['Lounge','Study','Terrace'],nx:'Chase lighting plan feedback'},
{id:'o',n:'Oak Villa',st:'Handover Prep',b:[318,320],ms:['Client walkthrough',2],rooms:['Entry','Dining','Bedroom 1','Bedroom 2'],nx:'Close remaining snags'}];

const OW=['Maya','Dev','Rhea','Sam'],CL=['Snags closed','Final clean','Inspections signed','Keys & manuals','As-builts filed','Client walkthrough'];
const TS=[['todo','To Do'],['prog','In Progress'],['blocked','Blocked'],['done','Completed']],DS=[['prep','Preparing'],['await','Awaiting Client'],['changes','Changes Requested'],['approved','Approved']],

const lab=(a,k)=>a.find(x=>x[0]==k)[1],opts=(a,s)=>a.map(x=>`<option value="${x[0]}" ${x[0]==s?'selected':''}>${x[1]}</option>`).join('');
const seed=()=>({
  p:SEED_PR.map(x=>({...x,custom:false})),
  ucl:{h:[],l:[],o:[]},
  t:[[1,'Install kitchen tiles','h','Kitchen','Dev','High',-1,'blocked','','m1'],[2,'Living false ceiling','h','Living','Sam','High',0,'prog','d1',''],[3,'Master wardrobe carcass','h','Master Suite','Rhea','Med',2,'todo','d2',''],[4,'Bath waterproofing test','h','Bath','Dev','High',0,'todo','',''],[5,'Electrical first fix · living','h','Living','Sam','Med',-2,'done','',''],[6,'Plaster walls · kitchen','h','Kitchen','Dev','Low',-5,'done','',''],[7,'Plumbing rough-in · bath','h','Bath','Sam','Med',-4,'done','',''],[8,'Master suite flooring','h','Master Suite','Rhea','Med',7,'todo','','m3'],
[9,'Lounge lighting layout','l','Lounge','Maya','High',1,'blocked','d3',''],[10,'Study joinery drawings','l','Study','Maya','Med',4,'todo','d4',''],[11,'Terrace decking spec','l','Terrace','Rhea','Low',16,'todo','','m4'],[12,'Site measure · lounge','l','Lounge','Sam','Med',-3,'done','',''],
[13,'Final paint touch-up','o','Dining','Dev','Med',-1,'prog','',''],[14,'Fix bedroom door alignment','o','Bedroom 1','Sam','High',1,'prog','','m5'],[15,'Entry lighting install','o','Entry','Sam','Med',-2,'done','d5',''],[16,'Dining joinery install','o','Dining','Dev','Med',-6,'done','',''],[17,'Bedroom 2 wardrobe fit','o','Bedroom 2','Rhea','Med',-4,'done','',''],[18,'Entry flooring polish','o','Entry','Dev','Low',-5,'done','',''],[19,'Bedroom 1 curtain fit','o','Bedroom 1','Rhea','Low',3,'todo','','']].map(a=>({id:'t'+a[0],t:a[1],p:a[2],r:a[3],o:a[4],pr:a[5],d:D(a[6]),s:a[7],ds:a[8],m:a[9]})),
d:[['d1','Living ceiling profile','h','v3','approved','Warm cove approved'],['d2','Master wardrobe layout','h','v2','await',''],['d3','Lounge lighting plan','l','v2','changes','Fewer spots, add dimmers'],['d4','Study joinery concept','l','v1','prep',''],['d5','Entry feature wall','o','v4','approved','']].map(a=>({id:a[0],t:a[1],p:a[2],v:a[3],s:a[4],f:a[5]})),
m:[['m1','Porcelain tiles 600×600','h','Kitchen','Cersan','48 m²',-2,'delayed'],['m2','Cove LED strips','h','Living','Luxa','60 m',-1,'delivered'],['m3','Oak flooring','h','Master Suite','Timberline','35 m²',6,'ordered'],['m4','Teak decking','l','Terrace','Timberline','22 m²',14,'toorder'],['m5','Door hinge sets','o','Bedroom 1','HardwareHub','12 pcs',1,'partial']].map(a=>({id:a[0],n:a[1],p:a[2],r:a[3],sp:a[4],q:a[5],e:D(a[6]),s:a[7]})),
i:[['i1','h','Kitchen','Water seepage near sink wall','high','open','Issue'],['i2','h','Bath','Waterproofing inspection','med','open','Inspection'],['i3','h','Living','Move socket 200 mm','low','open','Change'],['i4','o','Bedroom 1','Door alignment off','med','open','Snag'],['i5','o','Dining','Paint patch by window','low','prog','Snag'],['i6','o','Entry','Skirting scratch','low','resolved','Snag'],['i7','l','Terrace','Verify drain level','med','open','Issue']].map(a=>({id:a[0],p:a[1],r:a[2],t:a[3],sv:a[4],s:a[5],y:a[6]})),
cl:{h:[0,0,0,0,0,0],l:[0,0,0,0,0,0],o:[1,0,1,0,0,0]}});
let S,V='day',fp='',fs='',q='',sel=null,sp='h',LINK=null;
/* Shared data: when the Admin store (ipcs.demo.v2) exists, this panel reads/writes it through IPCS.pm; otherwise it falls back to its own pmp.v1 demo data. */
const save=()=>{if(LINK)IPCS.pm.save(LINK,S);else localStorage.setItem(K,JSON.stringify(S))};
try{LINK=window.IPCS?IPCS.pm.open():null}catch(e){LINK=null;console.error(e)}
if(LINK){S=LINK.state;OW.length=0;OW.push(...LINK.owners);sp=(S.p[0]||{}).id||''}
else{try{S=JSON.parse(localStorage.getItem(K))}catch(e){}}
if(S&&!LINK){
  if(!S.p)S.p=SEED_PR.map(x=>({...x,custom:false}));
  if(!S.ucl)S.ucl={h:[],l:[],o:[]};
}
PR=S?S.p:SEED_PR;
const des=id=>S.d.find(x=>x.id==id),mat=id=>S.m.find(x=>x.id==id),pj=id=>(PR.find(p=>p.id==id)||{id,n:'Project',st:'Execution',b:[0,1],ms:['Milestone',0],rooms:[],nx:''}),pn=id=>pj(id).n,mq=s=>!q||s.toLowerCase().includes(q.toLowerCase());
function why(t){if(t.s=='done')return'';const d=des(t.ds),m=mat(t.m);if(d&&d.s!='approved')return'Design: '+d.t;if(m&&m.s!='delivered'&&(m.s=='delayed'||df(m.e)>df(t.d)))return'Material: '+m.n;return''}

  IPCS.onChange(()=>{const l=IPCS.pm.open();if(!l)return;LINK=l;S=l.state;PR=S.p;OW.length=0;OW.push(...l.owners);
